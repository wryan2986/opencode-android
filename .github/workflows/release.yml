name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Decode signing key
        # The keystore is never in the repository and never in a log line. The
        # password comes from the environment and the file is shredded afterwards.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets are not configured; building unsigned/debug instead."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "keyAlias=$KEY_ALIAS"
          } > keystore.properties

      - name: Build release APK
        env:
          OPENCODE_KEYSTORE: keystore.jks
          OPENCODE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          OPENCODE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OPENCODE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Shred the signing material
        if: always()
        run: shred -u keystore.jks keystore.properties 2>/dev/null || rm -f keystore.jks keystore.properties

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true